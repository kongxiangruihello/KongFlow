# 在 GitHub 的 macOS 云端机器上编译、测试并打包 KongFlow，产物为 DMG 与 zip。
# 触发：推送到 main、提交拉取请求，或在 Actions 页面手动运行（Run workflow）。
# 发布：在 Actions 页面手动运行时勾选「发布」，或推送版本标签（如 0.41 或 v0.41.0）。
# 构建通过后自动新建 GitHub Release 并上传 DMG，设置里的「在线更新」就是从这个 Release 下载。
name: Build DMG

on:
  push:
    branches: [main]
    tags: ['[0-9]*', 'v[0-9]*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 发布：构建通过后新建 Release（版本号取自 version.py，仅限 main 分支）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-dmg-${{ github.ref }}
  cancel-in-progress: true

env:
  RIME_ICE_COMMIT: 859e3b5300e0ea01334a627b15db101e94312a75
  SQUIRREL_URL: https://github.com/rime/squirrel/releases/download/1.1.2/Squirrel-1.1.2.pkg
  SQUIRREL_SHA256: 614746013212937623d5bbab9901e9c43d1ec937aa32307d6b6092a05e308287

jobs:
  build:
    runs-on: macos-15   # Apple Silicon；macos-14 镜像已于 2026-11-02 停用
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches version.py
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 -B -c 'import os, sys, version
          tag = os.environ["GITHUB_REF_NAME"]
          if version.parse(tag) != version.parse(version.VERSION):
              sys.exit("标签 %s 与 version.py 中的 %s 不一致" % (tag, version.VERSION))'

      - name: Decide the release tag
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; else tag="$(python3 -B version.py | cut -d. -f1,2)"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Fetch rime-ice at the pinned commit
        run: |
          mkdir -p vendor/rime-ice
          cd vendor/rime-ice
          git init -q
          git remote add origin https://github.com/iDvel/rime-ice.git
          git fetch -q --depth 1 origin "$RIME_ICE_COMMIT"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$RIME_ICE_COMMIT"
          rm -rf .git

      - name: Fetch Squirrel 1.1.2 payload
        run: |
          mkdir -p deps branding/payload
          curl -fsSL -o deps/squirrel.pkg "$SQUIRREL_URL"
          echo "$SQUIRREL_SHA256  deps/squirrel.pkg" | shasum -a 256 -c -
          pkgutil --expand-full deps/squirrel.pkg deps/squirrel
          app="$(find deps/squirrel -type d -name Squirrel.app -prune | head -1)"
          test -n "$app"
          ditto "$app" branding/payload/Squirrel.app
          cp branding/BaseInfo.plist branding/payload/Squirrel.app/Contents/Info.plist
          rm -rf deps

      - name: Compile client
        run: sh build_client.sh

      - name: Run tests
        run: python3 -B -m unittest discover -s tests -v

      - name: Package pkg, zip and dmg
        run: python3 -B build_integrated.py

      - name: Collect artifacts
        run: |
          mkdir -p dist
          mv ../KongFlow-*.dmg ../KongFlow-*-Mac.zip dist/
          cd dist && shasum -a 256 * | tee SHA256SUMS.txt
          cp "../docs/releases/README-$(python3 -B ../version.py | cut -d. -f1,2).md" RELEASE_NOTES.md

      - uses: actions/upload-artifact@v4
        with:
          name: KongFlow-${{ github.sha }}
          path: dist/
          retention-days: 30

  # 只在推送版本标签、或在 main 上手动运行并勾选「发布」时运行：把上面构建出的 DMG 发布到 GitHub Release。
  release:
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KongFlow-${{ github.sha }}
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG 已存在。请先在 version.py 提高版本号。"
            exit 1
          fi
          # 标签不存在时由这里在本次构建的提交上创建。
          gh release create "$TAG" dist/KongFlow-*.dmg dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "KongFlow $TAG" --notes-file dist/RELEASE_NOTES.md
